services:
  pool:
    build: .
    image: vm-blockpool:latest
    container_name: vm-blockpool
    ports:
      - "${POOL_PORT:-8000}:8000"
    environment:
      POOL_TOTAL_BLOCKS: "${POOL_TOTAL_BLOCKS:-64}"
      POOL_DB_PATH: /data/pool.db
    volumes:
      - pool-data:/data
    restart: unless-stopped

volumes:
  pool-data:
